{% extends "articles/base.html" %}

{% block title %} Список статей {% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1>Статьи</h1>
    </div>
</div>

<div class="accordion" id="articlesAccordion">
    {% for article in articles %}
    <div class="accordion-item">
        <h2 class="accordion-header" id="header{{ article.pk }}">
            <button class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapse{{ article.pk }}"
                    aria-expanded="false"
                    aria-controls="collapse{{ article.pk }}">
                <span class="fw-semibold">{{ article.title }}</span>
            </button>
        </h2>

        <div id="collapse{{ article.pk }}" 
             class="accordion-collapse collapse"
             data-bs-parent="#articlesAccordion">
            <div class="accordion-body">
                {{ article.content|truncatewords:1 }}
                <a href="{% url 'articles:article_detail' article.pk %}">
                    Читать полностью
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <p>Нет статей</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
